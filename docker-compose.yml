version: "3.9"

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: callreception-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - callreception-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: callreception-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+psycopg2://callreception:callreception_secret@postgres:5432/callreception
      - REDIS_URL=redis://redis:6379/0
      - MONGODB_URL=mongodb://mongo:27017
      - MONGODB_DB=ai_call_reception
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - CORS_ORIGINS=["http://localhost:3000"]
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=callreception
      - POSTGRES_PASSWORD=callreception_secret
      - POSTGRES_DB=callreception
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - backend_logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mongo:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - callreception-net

  postgres:
    image: postgres:16-alpine
    container_name: callreception-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=callreception
      - POSTGRES_PASSWORD=callreception_secret
      - POSTGRES_DB=callreception
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callreception"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - callreception-net

  redis:
    image: redis:7-alpine
    container_name: callreception-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - callreception-net

  mongo:
    image: mongo:7
    container_name: callreception-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - callreception-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: callreception-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@callreception.com
      - PGADMIN_DEFAULT_PASSWORD=admin_secret
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - callreception-net

networks:
  callreception-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mongo_data:
    driver: local
  backend_logs:
    driver: local
  pgadmin_data:
    driver: local
